name: Trivy Security Scan

on:
  workflow_call:
    inputs:
      scan-ref:
        description: 'Directory to scan'
        default: '.'
        required: false
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  check-archived:
    name: Check if repository is archived
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is-archived: ${{ steps.check.outputs.archived }}
    steps:
      - name: Check repository archive status
        id: check
        run: |
          ARCHIVED=$(gh api repos/${{ github.repository }} --jq '.archived' 2>/dev/null || echo "false")
          echo "archived=$ARCHIVED" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy
    timeout-minutes: 15
    needs: check-archived
    if: ${{ needs.check-archived.outputs.is-archived == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-ref || '.' }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # v4
        if: always()
        continue-on-error: true  # SARIF upload requires GHAS on private repos; scan still runs
        with:
          sarif_file: trivy-results.sarif
          category: trivy
