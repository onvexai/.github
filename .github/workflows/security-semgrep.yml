name: Semgrep SAST

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  check-archived:
    name: Check if repository is archived
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is-archived: ${{ steps.check.outputs.archived }}
    steps:
      - name: Check repository archive status
        id: check
        run: |
          ARCHIVED=$(gh api repos/${{ github.repository }} --jq '.archived' 2>/dev/null || echo "false")
          echo "archived=$ARCHIVED" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep
    timeout-minutes: 20
    needs: check-archived
    if: ${{ needs.check-archived.outputs.is-archived == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        # No SEMGREP_APP_TOKEN = OSS mode, nothing sent to Semgrep cloud
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/secrets \
            --config=p/security-audit \
            --sarif \
            --output=semgrep.sarif \
            . || true

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # v4
        if: always()
        continue-on-error: true  # SARIF upload requires GHAS on private repos; scan still runs
        with:
          sarif_file: semgrep.sarif
          category: semgrep
